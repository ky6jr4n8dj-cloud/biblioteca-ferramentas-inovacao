<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca de Ferramentas de Inovação</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Biblioteca gratuita de ferramentas práticas de inovação da Nexoris, organizadas pelas fases do Nexoris Innovation Sprint.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout: barra escura da Nexoris + coluna central de 1120px; ficha em duas colunas (conteúdo + guia lateral), template preenchível em largura total */
:root{
  --brand:#2D3433; --brand-deep:#002734; --accent:#008000; --accent-ink:#006B00; --accent-soft:#E3F1E3;
  --mist:#DCE7EB; --ink:#2D3433; --ink-2:#4E5857; --muted:#6B7574; --line:#D3DDE0;
  --bg:#F3F7F8; --card:#FFFFFF; --field:#FBFDFD; --info-bg:#E8F0F2;
  --bar:#2D3433; --bar-ink:#FFFFFF; --bar-muted:#C9D5D8;
  --hero-a:#0B3B22; --hero-b:#1F2A29;
  --f-setup:#5E6B6A; --f-np:#0E8F86; --f-ideacao:#14872E; --f-elaboracao:#0D7648; --f-desenvolvimento:#0B4A5E;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,24,.06),0 1px 3px rgba(16,24,24,.08);
  --display:"Sora","Segoe UI",Helvetica,Arial,sans-serif;
  --body:"Jost",Futura,"Century Gothic","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ink:#E4ECEE; --ink-2:#C2CED1; --muted:#93A1A3; --line:#33403F; --bg:#141A1A; --card:#1C2423; --field:#18201F; --info-bg:#1F2B2B;
  --accent:#3FB34F; --accent-ink:#62C76F; --accent-soft:#1E3322; --mist:#22302F;
  --bar:#0F1414; --bar-ink:#FFFFFF; --bar-muted:#9FB0B2; --hero-a:#0A3A22; --hero-b:#121A19;
  --f-setup:#9AA9A8; --f-np:#3CC3B8; --f-ideacao:#4CC160; --f-elaboracao:#3FAF7A; --f-desenvolvimento:#5AB3CF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; } }
:root[data-theme="dark"]{
  --ink:#E4ECEE; --ink-2:#C2CED1; --muted:#93A1A3; --line:#33403F; --bg:#141A1A; --card:#1C2423; --field:#18201F; --info-bg:#1F2B2B;
  --accent:#3FB34F; --accent-ink:#62C76F; --accent-soft:#1E3322; --mist:#22302F;
  --bar:#0F1414; --bar-ink:#FFFFFF; --bar-muted:#9FB0B2; --hero-a:#0A3A22; --hero-b:#121A19;
  --f-setup:#9AA9A8; --f-np:#3CC3B8; --f-ideacao:#4CC160; --f-elaboracao:#3FAF7A; --f-desenvolvimento:#5AB3CF;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar)}
a{color:var(--accent-ink)} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0;color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);border-bottom:3px solid #008000}
.bar .wrap{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--bar-ink);min-width:0}
.brand img{height:28px;width:auto}
.wordmark{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;color:#fff;display:flex;align-items:center;gap:6px}
.wordmark svg{width:22px;height:22px}
.brand .sep{width:1px;height:22px;background:#5C6766}
.brand .prod{font-family:var(--display);font-weight:500;font-size:14px;color:var(--bar-ink);line-height:1.2}
.nav{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.nav a{color:var(--bar-ink);text-decoration:none;font-weight:500;font-size:15px;padding:7px 12px;border-radius:7px}
.nav a:hover{background:rgba(255,255,255,.08)}
.nav a[aria-current="page"]{background:rgba(255,255,255,.14)}

main{padding-block:28px 64px}

/* Hero */
.hero{background:linear-gradient(120deg,var(--hero-a),var(--hero-b) 70%);color:#fff;border-radius:14px;padding:clamp(24px,4vw,44px)}
.hero h1{color:#fff;font-size:clamp(28px,4.2vw,42px);font-weight:700;max-width:22ch}
.hero p{color:#D8E4E2;max-width:62ch;margin:14px 0 0;font-size:18px}
.search{margin-top:24px;display:flex;align-items:center;gap:0;background:#fff;border-radius:10px;max-width:640px;overflow:hidden}
.search label{font-family:var(--display);font-weight:700;color:#2D3433;padding:0 4px 0 16px;font-size:18px;white-space:nowrap}
.search input{flex:1;min-width:0;border:0;padding:14px 14px 14px 6px;font:inherit;font-size:18px;color:#2D3433;background:#fff}
.search input:focus{outline:none}
.search:focus-within{box-shadow:0 0 0 3px #3FB34F}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:15px;color:#B9CCC8}
.hero-meta b{color:#fff;font-family:var(--display)}

/* Fluxo das fases */
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:28px 0 8px}
.flow a{display:flex;flex-direction:column;gap:4px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--fc);border-radius:var(--radius);padding:14px 14px 12px;min-width:0}
.flow a:hover{border-color:var(--fc)}
.flow .k{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--fc);font-weight:600}
.flow .t{font-family:var(--display);font-weight:600;font-size:16px;line-height:1.25}
.flow .c{font-size:14px;color:var(--muted)}
.flow-note{font-size:14px;color:var(--muted);margin:0 0 8px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 6px}
.chip{font:inherit;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}

/* Seções e cartões "Quero..." */
.phase-sec{margin-top:34px}
.phase-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--fc);padding-bottom:8px;margin-bottom:14px}
.phase-head .num{font-family:var(--display);font-weight:700;color:var(--fc);font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.phase-head h2{font-size:24px}
.phase-head .sub{color:var(--muted);font-size:15px}
.phase-head a{margin-left:auto;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:flex;flex-direction:column;gap:6px;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 14px;box-shadow:var(--shadow);min-width:0}
.card:hover{border-color:var(--fc)}
.card .q{font-size:15px;color:var(--muted)}
.card .q b{color:var(--ink);font-weight:500}
.card h3{font-size:17px;color:var(--fc);margin-top:auto;padding-top:6px}
.card .tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:5px;background:var(--info-bg);color:var(--ink-2)}
.tag.new{background:var(--accent-soft);color:var(--accent-ink)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius)}

/* Ficha */
.crumbs{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.t-head{margin:14px 0 22px;padding:22px 24px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--fc);border-radius:var(--radius)}
.t-head .want{font-family:var(--display);font-weight:600;color:var(--fc);font-size:15px;letter-spacing:.02em}
.t-head h1{font-size:clamp(26px,3.6vw,36px);margin-top:4px}
.t-head .orig{font-size:14px;color:var(--muted);margin-top:4px}
.t-head .lead{font-size:19px;color:var(--ink-2);max-width:68ch;margin:12px 0 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;align-items:start}
.prose{min-width:0}
.prose section{margin-bottom:30px}
.prose h2{font-size:21px;margin-bottom:10px}
.prose p{margin:0 0 12px;max-width:68ch}
ol.steps{list-style:none;padding:0;margin:0;counter-reset:s;display:grid;gap:10px;max-width:72ch}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);font-family:var(--display);font-weight:700;font-size:14px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--fc);color:#fff}
ul.tips{margin:0;padding:0;list-style:none;display:grid;gap:8px;max-width:72ch}
ul.tips li{padding:10px 14px;background:var(--info-bg);border-radius:8px}
aside.side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 86px);display:grid;gap:14px}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.box h3{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;font-weight:600}
dl.meta{margin:0;display:grid;gap:10px}
dl.meta dt{font-size:13px;color:var(--muted)} dl.meta dd{margin:0;font-weight:500}
.rel{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.rel a{text-decoration:none;font-weight:500}
.rel small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.btn{font:inherit;font-weight:600;font-size:15px;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.btn.primary{background:#008000;border-color:#008000;color:#fff}
.btn:hover{filter:brightness(.97)}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink-2);background:var(--info-bg)}
tr:last-child td{border-bottom:0}
.ex-text{max-width:72ch;margin:0 0 12px}
.ex-note{font-size:15px;color:var(--muted);margin-top:10px}

/* Template */
.tpl{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.tpl-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.tpl-head h2{font-size:21px}
.tpl-head .hint{font-size:14px;color:var(--muted)}
.tpl-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.tpl-print-head{display:none}
.f{display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--field);min-width:0}
.f .l{font-family:var(--display);font-weight:600;font-size:13px;color:var(--ink)}
.f .h{font-size:13px;color:var(--muted)}
textarea{font:inherit;font-size:15px;color:var(--ink);background:transparent;border:0;resize:vertical;min-height:70px;width:100%;padding:2px 0}
textarea:focus{outline:none}
.f:focus-within{border-color:var(--fc);box-shadow:0 0 0 2px color-mix(in srgb,var(--fc) 25%,transparent)}
.tf{display:grid;gap:10px}
.tt td,.tt th{padding:0;border:1px solid var(--line)} .tt th{padding:8px 10px} .tt td.lab{padding:8px 10px;font-weight:500;background:var(--info-bg);width:26%}
.tt textarea{min-height:58px;padding:8px 10px}
.mx{display:grid;grid-template-columns:28px 1fr 1fr;grid-template-rows:1fr 1fr 28px;gap:8px}
.mx .ay{grid-row:1/3;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.mx .ax{grid-column:2/4;text-align:center;font-size:13px;color:var(--muted);font-weight:600}
.mx .f textarea{min-height:130px}
.q4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.q4 .ic{font-family:var(--display);font-size:26px;font-weight:700;color:var(--fc);line-height:1}
.q4 textarea{min-height:140px}
.frames{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.frame{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field);min-width:0}
.frame .draw{aspect-ratio:4/3;max-width:100%;border-bottom:1px dashed var(--line);display:grid;place-items:start;padding:6px 8px;font-family:var(--display);font-weight:700;color:var(--muted);font-size:13px}
.frame textarea{min-height:54px;padding:6px 8px}
.bmc{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:minmax(150px,auto) minmax(150px,auto) minmax(120px,auto);gap:6px}
.bmc .f textarea{min-height:100px;height:100%}
.vpc{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:stretch}
.vpc .side-l,.vpc .side-r{display:grid;gap:8px}
.vpc .side-r{border-radius:50% / 18%;border:2px solid var(--line);padding:22px 18px}
.vpc .side-l{border:2px solid var(--line);border-radius:10px;padding:12px}
.vpc h4{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center}
.saved{font-size:13px;color:var(--muted)}

.refs{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px;max-width:78ch}
.refs li{overflow-wrap:anywhere}
.links{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{display:flex;flex-direction:column;text-decoration:none;padding:12px 16px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);min-width:0;max-width:48%}
.pager a small{color:var(--muted);font-size:13px}
.pager .nx{margin-left:auto;text-align:right}

.page-h{font-size:clamp(26px,3.6vw,36px);margin:10px 0 12px}
.intro{max-width:70ch;color:var(--ink-2);font-size:18px}
.lens-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin:18px 0}
.lens{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.lens b{font-family:var(--display);display:block;margin-bottom:4px}
.note{background:var(--info-bg);border-radius:var(--radius);padding:16px 18px;max-width:78ch;font-size:16px}

footer{border-top:1px solid var(--line);padding-block:24px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;gap:12px 24px;flex-wrap:wrap;justify-content:space-between}

@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr)} aside.side{position:static} .box.gotpl{display:none}
  .flow{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bmc{grid-template-columns:1fr 1fr;grid-template-rows:none}
  .bmc .f{grid-area:auto !important}
  .frames{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vpc{grid-template-columns:1fr} .vpc .side-r{border-radius:14px}
}
@media (max-width:560px){
  body{font-size:16px}
  .brand .sep,.brand .prod{display:none}
  .nav{margin-left:0;width:100%}
  .flow{grid-template-columns:minmax(0,1fr)}
  .q4,.mx{grid-template-columns:1fr} .mx{grid-template-rows:none} .mx .ay,.mx .ax{display:none}
  .tf[style]{grid-template-columns:1fr !important}
  .search label{font-size:16px;padding-left:12px} .search input{font-size:16px}
  .pager a{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Impressão: só o template, em A4 paisagem */
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff;color:#000;font-size:11pt}
  body::before,.bar,footer,.crumbs,.t-head,.prose,aside.side,.pager,.tpl-actions,.tpl-head .hint,.saved,.tpl-head h2{display:none!important}
  body.print-ficha .prose,body.print-ficha .t-head{display:block!important}
  main{padding:0} .layout{display:block}
  .tpl{border:0;padding:0}
  .tpl-print-head{display:flex!important;justify-content:space-between;align-items:flex-end;border-bottom:1.5pt solid #2D3433;padding-bottom:4mm;margin-bottom:4mm}
  .tpl-print-head b{font-family:var(--display);font-size:18pt}
  .tpl-print-head span{font-size:9pt;color:#444;text-align:right}
  .f{background:#fff;border-color:#888;break-inside:avoid}
  textarea{resize:none;color:#000}
  .q4 textarea{min-height:62mm} .mx .f textarea{min-height:55mm} .tt textarea{min-height:16mm}
  .table-wrap{border:0;overflow:visible}
}
</style>

</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="brand" href="#inicio" aria-label="Biblioteca de Ferramentas de Inovação — início">
      <img id="logo" alt="Nexoris" hidden src="https://diagnostico.nexoris.com.br/static/img/nexoris-logo-dark-bg.png">
      <span class="wordmark" id="wordmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20c0-9 6-15 16-16-1 10-7 16-16 16z" fill="#3FB34F"/><path d="M4 20 14 10" stroke="#0B3B22" stroke-width="1.6"/></svg>nexoris</span>
      <span class="sep" aria-hidden="true"></span>
      <span class="prod">Biblioteca de Ferramentas<br>de Inovação</span>
    </a>
    <nav class="nav" aria-label="Principal">
      <a href="#inicio" data-nav="inicio">Ferramentas</a>
      <a href="#metodo" data-nav="metodo">Método</a>
      <a href="#fontes" data-nav="fontes">Fontes</a>
      <a href="https://www.nexoris.com.br/" target="_blank" rel="noopener">nexoris.com.br</a>
    </nav>
  </div>
</header>

<main id="app" class="wrap" tabindex="-1"></main>

<footer>
  <div class="wrap">
    <span>© 2026 Nexoris · Biblioteca de Ferramentas de Inovação · acesso gratuito</span>
    <span>Fontes consultadas em 5 nov. 2026 · <a href="#fontes">Referências e créditos</a></span>
  </div>
</footer>

<script>/* Biblioteca de Ferramentas de Inovação — Nexoris
   Parte 1: fases, Setup e Novas Perspectivas */
var BIB = window.BIB = window.BIB || {};
BIB.acesso = "5 nov. 2026";

BIB.fases = [
  { id: "setup", n: "0", nome: "Setup", sub: "Preparar o desafio",
    desc: "Antes de buscar respostas, a equipe precisa concordar sobre a pergunta. No Setup o desafio é enquadrado, testado quanto à robustez e conectado às pessoas que podem patrociná-lo, influenciá-lo ou ser afetadas por ele." },
  { id: "np", n: "1", nome: "Novas Perspectivas", sub: "Ver o que os outros não veem",
    desc: "Quatro lentes constroem um ponto de vista diferenciado sobre o futuro: duas olham para dentro (Ortodoxias e Competências Essenciais) e duas para fora (Descontinuidades e Insights de Stakeholders). O resultado é um conjunto de insights priorizados que alimenta a ideação." },
  { id: "ideacao", n: "2", nome: "Ideação", sub: "Gerar e combinar ideias",
    desc: "Os insights são combinados entre si para gerar grande volume de ideias, que depois são agrupadas em propostas de valor e priorizadas. Primeiro diverge-se com liberdade; depois converge-se com critério." },
  { id: "elaboracao", n: "3", nome: "Elaboração", sub: "Dar corpo às propostas",
    desc: "As propostas de valor selecionadas ganham forma de negócio: cliente, benefícios, modelo de negócio, hipóteses críticas e plano de experimentação. É o momento de olhar as ideias com rigor, sem matá-las cedo demais." },
  { id: "desenvolvimento", n: "4", nome: "Desenvolvimento", sub: "Testar, aprender, decidir",
    desc: "Protótipos simples colocam as hipóteses à prova junto a clientes e usuários reais. A cada ciclo de feedback a proposta melhora, até que a evidência permita uma decisão clara de seguir, ajustar ou parar." }
];

BIB.lentes = {
  ortodoxias: "Lente Ortodoxias",

<script>(function(){
"use strict";
var B = window.BIB, F = B.ferramentas, app = document.getElementById("app");
var byId = {}; F.forEach(function(f){ byId[f.id] = f; });
var faseById = {}; B.fases.forEach(function(p){ faseById[p.id] = p; });
var framed = (function(){ try { return window.self !== window.top; } catch(e){ return true; } })();

/* logo oficial quando disponível; marca em texto como alternativa */
var logo = document.getElementById("logo");
logo.addEventListener("load", function(){ logo.hidden = false; document.getElementById("wordmark").hidden = true; });

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function fc(fase){ return "--fc:var(--f-" + fase + ")"; }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function fonte(s){ return s.replace("{acesso}", B.acesso).replace(/(https?:\/\/[^\s<]+?)(\.?)(?=\s|$|<)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>$2'); }
function store(){ try { return window.localStorage; } catch(e){ return null; } }
function load(id){ try { var s = store(); return s ? JSON.parse(s.getItem("bib:" + id) || "{}") : {}; } catch(e){ return {}; } }
function save(id, data){ try { var s = store(); if (s) s.setItem("bib:" + id, JSON.stringify(data)); } catch(e){} }
function toolsOf(fase){ return F.filter(function(f){ return f.fase === fase; }); }

/* ---------- Cartão ---------- */
function card(f){
  return '<a class="card" href="#' + f.id + '" style="' + fc(f.fase) + '">' +
    '<span class="q">…quero <b>' + esc(f.quero) + '</b></span>' +
    '<h3>' + esc(f.nome) + '</h3>' +
    '<span class="tags">' + (f.lente && B.lentes[f.lente] ? '<span class="tag">' + esc(B.lentes[f.lente].replace("Lente ","")) + '</span>' : '') +
    (f.novo ? '<span class="tag new">Nova</span>' : '') + '</span></a>';
}

/* ---------- Início ---------- */
var filtro = "todas", busca = "";
function home(){
  var flow = B.fases.map(function(p){
    return '<a href="#fase-' + p.id + '" style="' + fc(p.id) + '"><span class="k">Fase ' + p.n + '</span><span class="t">' + esc(p.nome) + '</span><span class="c">' + toolsOf(p.id).length + ' ferramentas</span></a>';
  }).join("");
  var chips = '<button class="chip" data-f="todas" aria-pressed="' + (filtro==="todas") + '">Todas</button>' +
    B.fases.map(function(p){ return '<button class="chip" data-f="' + p.id + '" aria-pressed="' + (filtro===p.id) + '">' + esc(p.nome) + '</button>'; }).join("");
  app.innerHTML =
    '<section class="hero">' +
      '<h1>Ferramentas práticas para dar a partida e sustentar a inovação</h1>' +
      '<p>' + F.length + ' ferramentas gratuitas, organizadas pelas cinco fases do Nexoris Innovation Sprint. Cada uma traz explicação, passo a passo, exemplo, template para preencher e as fontes originais.</p>' +
      '<form class="search" role="search" id="sf"><label for="q">Quero…</label><input id="q" type="search" autocomplete="off" placeholder="gerar ideias, testar uma hipótese, entender o cliente" value="' + esc(busca) + '"></form>' +
      '<div class="hero-meta"><span><b>' + F.length + '</b> ferramentas</span><span><b>5</b> fases</span><span><b>4</b> lentes de Novas Perspectivas</span><span>Acesso livre, sem cadastro</span></div>' +
    '</section>' +
    '<nav class="flow" aria-label="Fases do Innovation Sprint">' + flow + '</nav>' +
    '<p class="flow-note">As fases se alternam entre abrir possibilidades e fazer escolhas. Você pode seguir a sequência completa ou usar qualquer ferramenta isoladamente.</p>' +
    '<div class="chips" role="group" aria-label="Filtrar por fase">' + chips + '</div>' +
    '<div id="list"></div>';
  renderList();
  var q = document.getElementById("q");

  document.getElementById("sf").addEventListener("submit", function(e){ e.preventDefault(); var first = document.querySelector("#list .card"); if (first) first.focus(); });
  app.querySelectorAll(".chip").forEach(function(b){ b.addEventListener("click", function(){
    filtro = b.dataset.f; app.querySelectorAll(".chip").forEach(function(c){ c.setAttribute("aria-pressed", c === b); }); renderList(); }); });
}
function renderList(){
  var terms = norm(busca).split(/\s+/).filter(Boolean);
  var out = B.fases.filter(function(p){ return filtro === "todas" || filtro === p.id; }).map(function(p){
    var items = toolsOf(p.id).filter(function(f){
      if (!terms.length) return true;
      var hay = norm([f.nome, f.original, f.quero, f.resumo, (f.oque||[]).join(" ")].join(" "));
      return terms.every(function(t){ return hay.indexOf(t) > -1; });
    });
    if (!items.length) return "";
    return '<section class="phase-sec" style="' + fc(p.id) + '"><div class="phase-head"><span class="num">Fase ' + p.n + '</span><h2>' + esc(p.nome) + '</h2><span class="sub">' + esc(p.sub) + '</span><a href="#fase-' + p.id + '">Sobre a fase</a></div>' +
      '<div class="grid">' + items.map(card).join("") + '</div></section>';
  }).join("");
  document.getElementById("list").innerHTML = out || '<div class="empty phase-sec">Nenhuma ferramenta encontrada para “' + esc(busca) + '”. Tente outra palavra, como “ideias”, “cliente” ou “testar”.</div>';

/* ---------- Fase ---------- */
function fase(id){

    var defs = [["ortodoxias","Interna","Crenças não questionadas sobre o negócio e o setor."],["competencias","Interna","O que a organização faz de único e onde mais isso gera valor."],["descontinuidades","Externa","Tendências e rupturas ainda subestimadas."],["stakeholders","Externa","Necessidades reais de clientes, usuários e parceiros."]];
    lentes = '<h2 style="font-size:21px;margin-top:26px">As quatro lentes</h2><div class="lens-list">' + defs.map(function(d){
      var t = items.filter(function(f){ return f.lente === d[0]; }).map(function(f){ return '<a href="#' + f.id + '">' + esc(f.nome) + '</a>'; }).join(" · ");
      return '<div class="lens"><b>' + esc(B.lentes[d[0]]) + '</b><span class="tag">' + d[1] + '</span><p style="margin:8px 0">' + d[2] + '</p><small>' + t + '</small></div>'; }).join("") + '</div>';
  }
  app.innerHTML = '<div style="' + fc(id) + '"><div class="crumbs"><a href="#inicio">Ferramentas</a><span>›</span><span>Fase ' + p.n + '</span></div>' +
    '<h1 class="page-h">Fase ' + p.n + ' · ' + esc(p.nome) + '</h1><p class="intro">' + esc(p.desc) + '</p>' + lentes +
    '<div class="phase-sec"><div class="phase-head"><h2>Ferramentas desta fase</h2><span class="sub">' + items.length + ' ferramentas</span></div><div class="grid">' + items.map(card).join("") + '</div></div>' +
    '<div class="pager">' + pagerFase(id) + '</div></div>';
}
function pagerFase(id){
  var i = B.fases.findIndex(function(p){ return p.id === id; }), a = B.fases[i-1], b = B.fases[i+1], h = "";
  if (a) h += '<a href="#fase-' + a.id + '"><small>Fase anterior</small>' + esc(a.nome) + '</a>';
  if (b) h += '<a class="nx" href="#fase-' + b.id + '"><small>Próxima fase</small>' + esc(b.nome) + '</a>';
  return h;
}

/* ---------- Templates ---------- */
var tc = 0;
function ta(label, extra){ tc++; return '<textarea id="t' + tc + '" data-k="' + tc + '" aria-label="' + esc(label) + '"' + (extra||"") + '></textarea>'; }
function field(l, h, style){ return '<div class="f"' + (style ? ' style="' + style + '"' : '') + '><span class="l">' + esc(l) + '</span>' + (h ? '<span class="h">' + esc(h) + '</span>' : '') + ta(l) + '</div>'; }
function template(f){
  var t = f.template; tc = 0;
  switch (t.tipo) {
  case "campos":
    return '<div class="tf" style="grid-template-columns:repeat(' + t.colunas + ',minmax(0,1fr))">' + t.campos.map(function(c){ return field(c[0], c[1]); }).join("") + '</div>';
  case "tabela":
    var rows = typeof t.linhas === "number" ? Array.apply(null, Array(t.linhas)).map(function(){ return null; }) : t.linhas;
    return '<div class="table-wrap"><table class="tt"><thead><tr>' + t.colunas.map(function(c){ return '<th scope="col">' + esc(c) + '</th>'; }).join("") + '</tr></thead><tbody>' +
      rows.map(function(r, ri){ return '<tr>' + t.colunas.map(function(c, ci){
        if (r !== null && ci === 0) return '<td class="lab">' + esc(r) + '</td>';
        return '<td>' + ta(c + " — linha " + (ri+1)) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
  case "matriz":
    var q = t.quadrantes;
    return '<div class="mx"><span class="ay">' + esc(t.eixoY) + '</span>' + q.map(function(c){ return field(c[0], c[1]); }).join("") + '<span></span><span class="ax">' + esc(t.eixoX) + '</span></div>';
  case "grade":
    return (t.cabecalho ? '<div class="tf" style="margin-bottom:8px">' + field(t.cabecalho, "") + '</div>' : '') +
      '<div class="tf" style="grid-template-columns:repeat(' + t.colunas + ',minmax(0,1fr))">' + t.celulas.map(function(c){ return field(c[0], c[1], c[2] ? "grid-column:span " + c[2] : ""); }).join("") + '</div>';
  case "quadrantes":
    return '<div class="q4">' + t.celulas.map(function(c){ return '<div class="f"><span class="ic" aria-hidden="true">' + c[0] + '</span><span class="l">' + esc(c[1]) + '</span>' + ta(c[1]) + '</div>'; }).join("") + '</div>';
  case "jornada":
    var cols = []; for (var i=1;i<=t.etapas;i++) cols.push("Etapa " + i);
    return '<div class="table-wrap"><table class="tt"><thead><tr><th scope="col"></th>' + cols.map(function(c){ return '<th scope="col">' + c + '</th>'; }).join("") + '</tr></thead><tbody>' +
      t.linhas.map(function(l){ return '<tr><td class="lab">' + esc(l) + '</td>' + cols.map(function(c){ return '<td>' + ta(l + " — " + c) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
  case "quadros":
    var h = t.titulo ? '<div class="tf" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:10px">' + field("Título da história","") + field("Personagens","") + field("Lugares","") + '</div>' : "";
    var fr = []; for (var j=1;j<=t.n;j++) fr.push('<div class="frame"><div class="draw">' + j + '</div>' + ta("Legenda do quadro " + j, ' placeholder="Legenda do quadro ' + j + '"') + '</div>');
    return h + '<div class="frames">' + fr.join("") + '</div>';
  case "bmc":
    var b = [["Parcerias-chave","Quem nos ajuda? O que eles fazem por nós?","1/1/3/3"],["Atividades-chave","O que precisamos fazer muito bem?","1/3/2/5"],["Recursos-chave","Que ativos são indispensáveis?","2/3/3/5"],["Proposta de valor","Que valor entregamos? Que problema resolvemos?","1/5/3/7"],["Relacionamento com clientes","Como interagimos ao longo da jornada?","1/7/2/9"],["Canais","Como alcançamos e entregamos?","2/7/3/9"],["Segmentos de clientes","Para quem criamos valor?","1/9/3/11"],["Estrutura de custos","Quais são os principais custos?","3/1/4/6"],["Fontes de receita","Por que e como os clientes pagam?","3/6/4/11"]];
    return '<div class="bmc">' + b.map(function(c){ return field(c[0], c[1], "grid-area:" + c[2]); }).join("") + '</div><p class="saved" style="margin-top:8px">Business Model Canvas, de Strategyzer AG, licenciado sob CC BY-SA 3.0.</p>';
  case "vpc":
    return '<div class="vpc"><div class="side-l"><h4>Mapa de valor</h4>' + field("Produtos e serviços","O que oferecemos?") + field("Aliviadores de dor","Como eliminamos ou reduzimos as dores?") + field("Criadores de ganho","Como produzimos os ganhos desejados?") + '</div>' +
      '<div class="side-r"><h4>Perfil do cliente</h4>' + field("Tarefas do cliente","Funcionais, sociais e emocionais") + field("Dores","Frustrações, riscos e obstáculos") + field("Ganhos","Resultados e benefícios desejados") + '</div></div>' +
      '<p class="saved" style="margin-top:8px">Baseado no Value Proposition Canvas, de Strategyzer AG.</p>';
  }
  return "";
}
function bindTemplate(f){
  var data = load(f.id), box = document.getElementById("tpl"), st = document.getElementById("saved");
  box.querySelectorAll("textarea").forEach(function(el){
    if (data[el.dataset.k]) el.value = data[el.dataset.k];
    el.addEventListener("input", function(){ data[el.dataset.k] = el.value; save(f.id, data); st.textContent = "Salvo neste navegador"; });
  });
  var clr = document.getElementById("clr"), armed = false;
  clr.addEventListener("click", function(){
    if (!armed) { armed = true; clr.textContent = "Confirmar limpeza"; setTimeout(function(){ armed = false; clr.textContent = "Limpar"; }, 4000); return; }
    data = {}; save(f.id, data); box.querySelectorAll("textarea").forEach(function(el){ el.value = ""; }); armed = false; clr.textContent = "Limpar"; st.textContent = "Template limpo";
  });
  var pt = document.getElementById("pt"), pf = document.getElementById("pf");
  if (pt) pt.addEventListener("click", function(){ document.body.classList.remove("print-ficha"); window.print(); });
  if (pf) pf.addEventListener("click", function(){ document.body.classList.add("print-ficha"); window.print(); setTimeout(function(){ document.body.classList.remove("print-ficha"); }, 500); });
}

/* ---------- Ficha ---------- */
function tool(f){
  var p = faseById[f.fase], list = toolsOf(f.fase), i = list.indexOf(f), prev = list[i-1], next = list[i+1];
  var ex = f.exemplo || {}, exHtml = "";
  if (ex.texto) exHtml += '<p class="ex-text">' + esc(ex.texto) + '</p>';
  if (ex.tabela) exHtml += '<div class="table-wrap"><table><thead><tr>' + ex.tabela.cab.map(function(c){ return '<th scope="col">' + esc(c) + '</th>'; }).join("") + '</tr></thead><tbody>' +
    ex.tabela.linhas.map(function(r){ return '<tr>' + r.map(function(c){ return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>'; }).join("") + '</tbody></table></div>';
  if (ex.nota) exHtml += '<p class="ex-note">' + esc(ex.nota) + '</p>';
  var tambem = (f.tambem || []).map(function(x){ return '<a href="#fase-' + x + '">' + esc(faseById[x].nome) + '</a>'; }).join(", ");
  var printBtns = framed ? "" : '<button class="btn primary" id="pt" type="button">Imprimir template</button><button class="btn" id="pf" type="button">Imprimir ficha</button>';
  app.innerHTML = '<div style="' + fc(f.fase) + '">' +
    '<div class="crumbs"><a href="#inicio">Ferramentas</a><span>›</span><a href="#fase-' + p.id + '">Fase ' + p.n + ' · ' + esc(p.nome) + '</a><span>›</span><span>' + esc(f.nome) + '</span></div>' +
    '<header class="t-head"><div class="want">Quero ' + esc(f.quero) + '</div><h1>' + esc(f.nome) + '</h1>' +
      (f.original && f.original !== f.nome ? '<div class="orig">Em inglês: ' + esc(f.original) + '</div>' : '') +
      '<p class="lead">' + esc(f.resumo) + '</p></header>' +
    '<div class="layout"><div class="prose">' +
      '<section><h2>O que é</h2>' + f.oque.map(function(x){ return '<p>' + esc(x) + '</p>'; }).join("") + '</section>' +
      '<section><h2>Passo a passo</h2><ol class="steps">' + f.passos.map(function(x){ return '<li><span>' + esc(x) + '</span></li>'; }).join("") + '</ol></section>' +
      (f.dicas && f.dicas.length ? '<section><h2>Dicas</h2><ul class="tips">' + f.dicas.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join("") + '</ul></section>' : '') +
      (exHtml ? '<section><h2>Exemplo' + (ex.titulo ? ': ' + esc(ex.titulo) : '') + '</h2>' + exHtml + '</section>' : '') +
    '</div><aside class="side" aria-label="Resumo da ferramenta">' +
      '<div class="box"><h3>Quando usar</h3><dl class="meta"><div><dt>Fase</dt><dd><a href="#fase-' + p.id + '">' + p.n + ' · ' + esc(p.nome) + '</a></dd></div>' +
        (f.lente && B.lentes[f.lente] ? '<div><dt>Lente</dt><dd>' + esc(B.lentes[f.lente]) + '</dd></div>' : '') +
        (tambem ? '<div><dt>Também útil em</dt><dd>' + tambem + '</dd></div>' : '') +
        '<div><dt>Duração típica</dt><dd>' + esc(f.tempo) + '</dd></div><div><dt>Pessoas</dt><dd>' + esc(f.pessoas) + '</dd></div></dl></div>' +
      '<div class="box"><h3>Use em conjunto com</h3><ul class="rel">' + (f.rel||[]).map(function(r){ var g = byId[r]; return g ? '<li><a href="#' + g.id + '">' + esc(g.nome) + '<small>' + esc(cap(g.quero)) + '</small></a></li>' : ''; }).join("") + '</ul></div>' +
      '<div class="box gotpl"><h3>Template</h3><p style="margin:0 0 10px;font-size:15px">Preencha na tela ou imprima para usar com post-its.</p><a class="btn primary" href="#tpl" style="display:inline-block;text-decoration:none" id="gotpl">Ir para o template</a></div>' +
    '</aside></div>' +
    '<section class="tpl" id="tpl" style="margin-top:8px"><div class="tpl-print-head"><b>' + esc(f.nome) + '</b><span>Biblioteca de Ferramentas de Inovação · Nexoris<br>Fase ' + p.n + ' · ' + esc(p.nome) + '</span></div>' +
      '<div class="tpl-head"><h2>Template</h2><span class="hint">O que você escrever fica salvo apenas neste navegador.</span><div class="tpl-actions"><span class="saved" id="saved" aria-live="polite"></span>' + printBtns + '<button class="btn" id="clr" type="button">Limpar</button></div></div>' +
      template(f) + '</section>' +
    '<div class="layout" style="margin-top:30px"><div class="prose">' +
      (f.saibaMais && f.saibaMais.length ? '<section><h2>Saiba mais</h2><ul class="links">' + f.saibaMais.map(function(l){ return '<li><a href="' + esc(l[1]) + '" target="_blank" rel="noopener">' + esc(l[0]) + ' ↗</a></li>'; }).join("") + '</ul></section>' : '') +
      '<section><h2>Fontes</h2><ol class="refs">' + f.fontes.map(function(s){ return '<li>' + fonte(s) + '</li>'; }).join("") + '</ol></section>' +
    '</div></div>' +
    '<nav class="pager" aria-label="Navegação na fase">' +
      (prev ? '<a href="#' + prev.id + '"><small>Anterior</small>' + esc(prev.nome) + '</a>' : '') +
      (next ? '<a class="nx" href="#' + next.id + '"><small>Próxima</small>' + esc(next.nome) + '</a>' : '<a class="nx" href="#fase-' + p.id + '"><small>Voltar para</small>Fase ' + p.n + ' · ' + esc(p.nome) + '</a>') +
    '</nav></div>';
  document.getElementById("gotpl").addEventListener("click", function(e){ e.preventDefault(); document.getElementById("tpl").scrollIntoView({behavior:"smooth", block:"start"}); });
  bindTemplate(f);
}

/* ---------- Método ---------- */
function metodo(){
  app.innerHTML = '<div class="crumbs"><a href="#inicio">Ferramentas</a><span>›</span><span>Método</span></div>' +
    '<h1 class="page-h">Como a biblioteca está organizada</h1>' +
    '<p class="intro">As ferramentas seguem as cinco fases do Nexoris Innovation Sprint, a metodologia da Nexoris para transformar um desafio de negócio em propostas de valor testadas. Cada fase tem um papel: abrir possibilidades ou fazer escolhas.</p>' +
    '<div class="grid" style="margin-top:22px">' + B.fases.map(function(p){
      return '<a class="card" href="#fase-' + p.id + '" style="' + fc(p.id) + '"><span class="q">Fase ' + p.n + ' · ' + esc(p.sub) + '</span><h3 style="margin-top:0;padding-top:0">' + esc(p.nome) + '</h3><span style="font-size:15px;color:var(--ink-2)">' + esc(p.desc) + '</span></a>'; }).join("") + '</div>' +
    '<section class="phase-sec"><h2 style="font-size:22px;margin-bottom:10px">Como usar</h2><ul class="tips">' +
      '<li>Comece pela pergunta “Quero…”: cada ferramenta responde a uma intenção concreta. Use a busca da página inicial.</li>' +
      '<li>As ferramentas podem ser usadas isoladamente, em uma reunião de uma hora, ou encadeadas em um sprint completo de várias semanas.</li>' +
      '<li>Os templates podem ser preenchidos na tela ou impressos em formato grande para trabalhar com post-its. O que você escreve fica salvo apenas no seu navegador.</li>' +
      '<li>Ferramentas marcadas como <span class="tag new">Nova</span> foram criadas para cobrir etapas do Innovation Sprint que o kit original não tinha.</li>' +
    '</ul></section>' +
    '<section class="phase-sec"><div class="note">Quer aplicar o Innovation Sprint na sua organização, com facilitação? <a href="https://www.nexoris.com.br/solu%C3%A7%C3%B5es" target="_blank" rel="noopener">Conheça as soluções da Nexoris ↗</a> ou faça o <a href="https://diagnostico.nexoris.com.br/" target="_blank" rel="noopener">Diagnóstico de Inovação ↗</a>.</div></section>';
}

/* ---------- Fontes ---------- */
function fontes(){
  var all = {}, use = {};
  F.forEach(function(f){ f.fontes.forEach(function(s){ var k = s.replace(/<[^>]+>/g,""); all[k] = s; (use[k] = use[k] || []).push(f); }); });
  var keys = Object.keys(all).sort(function(a,b){ return norm(a).localeCompare(norm(b)); });
  app.innerHTML = '<div class="crumbs"><a href="#inicio">Ferramentas</a><span>›</span><span>Fontes</span></div>' +
    '<h1 class="page-h">Referências e créditos</h1>' +
    '<div class="note"><p style="margin:0 0 10px">Esta biblioteca é uma evolução do <i>Innovator’s Toolkit</i>, criado em 2016 como recurso interno de inovação e agora revisto, traduzido e ampliado pela Nexoris. Os textos foram reescritos em português e as ferramentas, reorganizadas pelas fases do Nexoris Innovation Sprint.</p>' +
    '<p style="margin:0 0 10px">Os métodos apresentados pertencem a seus criadores e são citados em cada ficha. O Business Model Canvas é disponibilizado pela Strategyzer sob licença Creative Commons BY-SA 3.0; o Value Proposition Canvas é da Strategyzer AG; o método Scenes é do SAP AppHaus.</p>' +
    '<p style="margin:0">Referências no padrão ABNT NBR 6023. Endereços eletrônicos consultados em ' + B.acesso + '.</p></div>' +
    '<section class="phase-sec"><h2 style="font-size:22px;margin-bottom:12px">Bibliografia (' + keys.length + ')</h2><ol class="refs" style="list-style:none;padding:0">' +
    keys.map(function(k){ return '<li>' + fonte(all[k]) + '<br><small style="color:var(--muted)">Usada em: ' + use[k].map(function(f){ return '<a href="#' + f.id + '">' + esc(f.nome) + '</a>'; }).join(", ") + '</small></li>'; }).join("") + '</ol></section>';
}

/* ---------- Rotas ---------- */
function route(){
  var h = decodeURIComponent(location.hash.replace(/^#/, "")), nav = "inicio";
  if (h === "tpl") return;
  if (byId[h]) { tool(byId[h]); document.title = byId[h].nome + " · Biblioteca de Ferramentas de Inovação"; }
  else if (h.indexOf("fase-") === 0 && faseById[h.slice(5)]) { fase(h.slice(5)); document.title = "Fase " + faseById[h.slice(5)].nome + " · Biblioteca de Ferramentas de Inovação"; }
  else if (h === "metodo") { metodo(); nav = "metodo"; document.title = "Método · Biblioteca de Ferramentas de Inovação"; }
  else if (h === "fontes") { fontes(); nav = "fontes"; document.title = "Fontes · Biblioteca de Ferramentas de Inovação"; }
  else { home(); document.title = "Biblioteca de Ferramentas de Inovação"; }
  document.querySelectorAll("[data-nav]").forEach(function(a){ if (a.dataset.nav === nav) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);
route();
})();
</script>
